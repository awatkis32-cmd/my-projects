<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andre's Walking Route App</title>
</head>
<body>
   <h1>Andre's Walking Route Application</h1>
   <p>How long do you want to walk?</p> 

   <button onclick="chooseTime(5)">5 Minutes</button>
   <button onclick="chooseTime(10)">10 Minutes</button>
   <button onclick="chooseTime(15)">15 Minutes</button>
   <button onclick="chooseTime(20)">20 Minutes</button>
   <button onclick="chooseTime(25)">25 Minutes</button>
   <button onclick="chooseTime(30)">30 Minutes</button>
   <button onclick="chooseTime(35)">35 Minutes</button>
   <button onclick="chooseTime(40)">40 Minutes</button>
   <button onclick="chooseTime(45)">45 Minutes</button>
   <button onclick="chooseTime(50)">50 Minutes</button>
   <button onclick="chooseTime(55)">55 Minutes</button>
   <button onclick="chooseTime(60)">60 Minutes</button>

   <p id="result"></p>

   <button onclick="getLocation()">Use current my location</button>
   <p id="location"></p>
    <div id="map" style="height: 400px; width: 100%;"></div>
   <script src="config.js"></script>
   <script>
    // Lets set it at an easy walking pace: about 80 meters per minute
    const METERS_PER_MINUTE = 80;

    function chooseTime(Minutes) {
        const meters =  Minutes * METERS_PER_MINUTE;
        const km = (meters / 1000).toFixed(1);
        document.getElementById("result").textContent = Minutes + " minutes is about " + km + " km.";
    }
    function loadGoogleMaps() {
    return new Promise(function (resolve, reject) {
        if (window.google && google.maps && google.maps.importLibrary) {
            resolve();
            return;
        }
        window.onGoogleMapsReady = resolve;
        const script = document.createElement("script");
        script.src = "https://maps.googleapis.com/maps/api/js?key=" + GOOGLE_MAPS_KEY + "&loading=async&libraries=maps,marker&callback=onGoogleMapsReady";
        script.onerror = reject;
        document.head.appendChild(script);
    });
}
    async function showMap (lat, lng) {
        await loadGoogleMaps();
        const { Map } = await google.maps.importLibrary("maps");
        const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");
        const map = new Map(document.getElementById("map"), {
            center: { lat: lat, lng: lng },
            zoom: 16,
            mapId: "DEMO_MAP_ID"
        });
        new AdvancedMarkerElement({
            map: map,
            position: { lat: lat, lng: lng },
            title: "You are here"
        });
    }

    function getLocation() {
        if (!navigator.geolocation) {
            document.getElementById("location").textContent = "Your browser can't share the location.";
            return;
        }
        navigator.geolocation.getCurrentPosition(
            function (position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                document.getElementById("location").textContent = "Location found. Loading map...";
                showMap(lat, lng).then(function () {
                    document.getElementById("location").textContent = "You are here.";
                }).catch(function (error) {
                    console.error("Map problem:", error);
                    document.getElementById("location").textContent = "Got your location, but the map couldn't load. Details: " + (error && error.message ? error.message : "the Google script did not finish loading");
                });
            },
            function () {
                document.getElementById("location").textContent = "Couldn't get your location. Did you click Block? Or do you have a location blocker on?";
            }
        );
    }
   </script>
</body>
</html>
